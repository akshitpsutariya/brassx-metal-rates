name: Update Metal Rates

on:
  workflow_dispatch:

jobs:

  update-metal-rates:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run Script
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python main.py
